# salman workspace.
#
# The version here is NOT the source of truth: the root VERSION file is.
# crates/salman-core/src/version.rs includes VERSION at compile time and
# fails the build if it disagrees with CARGO_PKG_VERSION, so the two cannot
# drift. See docs/adr/ADR-0008-one-version-truth.md.

[workspace]
resolver = "3"
# Crates are added to this list as they acquire real content. salman does not
# carry empty crates that imply a surface exists before it does.
members = [
    "crates/salman-core",
    "crates/salman-lang",
    "crates/salman-vm",
    "crates/salman-modbus",
    "crates/salman-modbus-net",
    "crates/salman-project",
    "crates/salman-link",
    "crates/salman-capture",
    "crates/salman-findings",
    "crates/salman-analyse",
    "crates/salman-plcopen",
    "crates/salman-test",
    "crates/salman-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
authors = ["salman contributors"]
description = "Vendor-neutral, text-first IEC 61131-3 engineering workbench"
keywords = ["plc", "iec61131", "automation", "structured-text", "simulation"]
categories = ["development-tools", "simulation"]

[workspace.dependencies]
salman-core = { path = "crates/salman-core", version = "0.0.1" }
salman-lang = { path = "crates/salman-lang", version = "0.0.1" }
salman-vm = { path = "crates/salman-vm", version = "0.0.1" }
salman-modbus = { path = "crates/salman-modbus", version = "0.0.1" }
salman-modbus-net = { path = "crates/salman-modbus-net", version = "0.0.1" }
salman-project = { path = "crates/salman-project", version = "0.0.1" }
salman-link = { path = "crates/salman-link", version = "0.0.1" }
salman-capture = { path = "crates/salman-capture", version = "0.0.1" }
salman-findings = { path = "crates/salman-findings", version = "0.0.1" }
salman-analyse = { path = "crates/salman-analyse", version = "0.0.1" }
salman-plcopen = { path = "crates/salman-plcopen", version = "0.0.1" }
salman-test = { path = "crates/salman-test", version = "0.0.1" }

[workspace.lints.rust]
# salman parses bytes that arrive from industrial networks and from files it
# did not write. There is no unsafe code in this workspace, and there will not
# be one without an ADR.
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Rule 7: a decoder or parser must never panic on malformed input. These are
# denied in library code; every crate re-allows them under cfg(test).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Noise from `pedantic` that fights the domain vocabulary rather than helping.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
# Domain vocabulary is full of proper nouns (JUnit, PLCopen, TwinCAT, EtherCAT,
# CANopen) that this lint wants wrapped in backticks in prose. It fights the
# writing rather than helping it.
doc_markdown = "allow"
# A lexer's main dispatch and a parser's statement dispatch are long by nature.
# Splitting them to satisfy a line count would scatter one decision across
# several functions and make the grammar harder, not easier, to check.
too_many_lines = "allow"
# Configuration structs are mostly flags. That is what configuration is.
struct_excessive_bools = "allow"
# In a language front end, match arms are grouped by the domain concept, not by
# whether their bodies happen to coincide. Merging the USINT arm with the BYTE
# arm because both hold 0..255 would hide that they are different types with
# different rules, which is exactly what this code exists to keep straight.
match_same_arms = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"

[profile.dev]
# Keeps the 60 s test-suite budget (README performance table) reachable
# without giving up debug info.
opt-level = 1
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

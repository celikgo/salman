# Rule 6: same project, same inputs, same seed, identical trace, bit for bit.
#
# This workflow is the gate that promise is checked by, and it now does the two
# halves ADR-0005 asks for.
#
# 1. THE SUITE, ON THREE PLATFORMS. `cargo test --workspace --all-features` on
#    Linux, macOS and Windows. That suite contains
#    `the_recorded_trace_matches_the_committed_golden_file`
#    (crates/salman-cli/tests/conveyor_example.rs), which re-renders the
#    conveyor's trace and asserts it equals the committed
#    examples/conveyor/conveyor.trace byte for byte. So each platform is checked
#    against a file the repository carries.
#
# 2. THE THREE PLATFORMS AGAINST EACH OTHER. Each leg runs
#    examples/determinism/hazards.st, uploads the trace, and the `compare` job
#    below asserts the three fingerprints are equal. This is the half that was a
#    placeholder until now, and it is the half that answers "which platform
#    disagreed", which comparing each platform against a committed file cannot.
#
# WHY THE ASSERTION IS ON THE FINGERPRINT AND NOT ON THE TRACE TEXT
#
# ADR-0005 rejected comparing traces as rendered text, in one sentence worth
# keeping in view: "salman renders text for humans and hashes bytes for the
# gate." Rendered text puts Rust's float formatting inside the determinism
# promise — it is platform-identical today, carries no cross-version guarantee,
# and has changed before, so a toolchain bump could break this gate for a reason
# that has nothing to do with the simulation.
#
# It is also weaker in the way that matters most here. The reference program
# puts a NaN, an infinity and a negative zero into the trace on purpose. All
# three render identically on every architecture, so a NaN that stopped being
# canonicalised would still print `NaN` — while the fingerprint, which is
# SHA-256 over `Value::write_canonical_bytes` rather than over the text, would
# change. So the gate asserts on the fingerprint, and prints a text diff only
# once it has already decided something is wrong, which is the one job rendered
# text has here: telling a human where to look.
#
# WHY THIS IS SEPARATE FROM ci.yml
#
# The overlap with ci.yml's `test` job is real. This workflow is where the
# cross-platform comparison lives, and it needs an artefact upload from each OS
# and a job that fans them back in — a shape ci.yml should not grow.
name: determinism

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: determinism-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # One list, in one place, so that three legs cannot record different columns
  # and produce a disagreement that is about this file rather than about salman.
  RECORD: Scan,Wrapping,Drift,Third,NotANumber,Infinite,NegZero,Elapsed,Phase,Alternating,Second
  SCANS: "1000"

jobs:
  cross-platform-tests:
    name: workspace tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # "Which platform disagreed?" is the only interesting question here, so
      # every leg must run even after one has failed.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - name: Run the workspace test suite
        run: cargo test --workspace --all-features

      # `cargo test` above already builds the binary, because salman-cli's
      # integration tests drive it. This step is stated rather than relied on:
      # a cached build costs a second, and depending on a side effect of another
      # step is how a job breaks for a reason nobody can see.
      #
      # The debug profile is deliberate. Debug and release produce the same
      # fingerprint — Rust neither contracts nor reassociates the float
      # operations salman uses — and all three legs use the same profile, so the
      # comparison is like-for-like either way. Building release here as well
      # would double this workflow's cost to prove something perf.yml builds
      # already.
      - name: Build the CLI
        run: cargo build -p salman-cli

      - name: Record the reference trace
        shell: bash
        run: |
          set -euo pipefail
          bin=target/debug/salman
          if [ "${RUNNER_OS}" = "Windows" ]; then
            bin=target/debug/salman.exe
          fi
          "$bin" run examples/determinism/hazards.st \
              --scans "${SCANS}" \
              --record "${RECORD}" \
              --trace "trace-${{ matrix.os }}.txt"
          echo
          echo "Header of trace-${{ matrix.os }}.txt:"
          head -6 "trace-${{ matrix.os }}.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: trace-${{ matrix.os }}
          path: trace-${{ matrix.os }}.txt
          if-no-files-found: error
          retention-days: 7

  compare:
    name: the three platforms agree
    needs: cross-platform-tests
    runs-on: ubuntu-latest
    steps:
      # upload-artifact v7 and download-artifact v8 are the current matched
      # pair; the major numbers differ on purpose and are not a typo. Every
      # trace carries its platform in its filename, so merge-multiple is safe.
      - uses: actions/download-artifact@v8
        with:
          pattern: trace-*
          merge-multiple: true
          path: traces

      - name: Every platform produced the same fingerprint
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import difflib
          import pathlib
          import sys

          EXPECTED = {"ubuntu-latest", "macos-latest", "windows-latest"}
          PREFIX = "# fingerprint: "

          traces = {}
          failures = []

          for path in sorted(pathlib.Path("traces").glob("trace-*.txt")):
              platform = path.stem[len("trace-"):]
              text = path.read_text()
              fingerprint = next(
                  (
                      line[len(PREFIX):].strip()
                      for line in text.splitlines()
                      if line.startswith(PREFIX)
                  ),
                  None,
              )
              if fingerprint is None:
                  failures.append(
                      f"{platform}: the trace carries no fingerprint line, so "
                      f"there is nothing to compare"
                  )
                  continue
              traces[platform] = (fingerprint, text)

          # A partial or empty artefact set must not pass. A comparison that
          # compared nothing is the exact failure mode this repository exists to
          # avoid, and a green tick on it would be worse than no gate at all.
          for platform in sorted(EXPECTED - set(traces)):
              failures.append(
                  f"{platform}: no trace arrived from it, so the three "
                  f"platforms were not compared"
              )

          for platform in sorted(traces):
              print(f"  {platform:<16} {traces[platform][0]}")
          print()

          fingerprints = {f for f, _ in traces.values()}

          if len(fingerprints) > 1:
              failures.append(
                  "the platforms do not agree: "
                  + ", ".join(f"{p} = {traces[p][0]}" for p in sorted(traces))
              )
              # The fingerprint says that something differs; only the text says
              # where. Print it, for a human.
              reference = sorted(traces)[0]
              for platform in sorted(traces):
                  if platform == reference or traces[platform][1] == traces[reference][1]:
                      continue
                  print(f"--- {reference} against {platform} ---")
                  diff = difflib.unified_diff(
                      traces[reference][1].splitlines(),
                      traces[platform][1].splitlines(),
                      fromfile=reference,
                      tofile=platform,
                      lineterm="",
                      n=1,
                  )
                  for i, line in enumerate(diff):
                      if i >= 40:
                          print("  ... truncated")
                          break
                      print(f"  {line}")
                  print()
          elif len({t for _, t in traces.values()}) > 1:
              # Same canonical bytes, different rendering. Not a determinism
              # failure by ADR-0005's definition — the gate is the fingerprint —
              # but it means float formatting differs between platforms, which
              # nobody expects and somebody should look at.
              print(
                  "::warning title=Traces render differently::Every platform "
                  "agrees on the fingerprint, so the values are identical, but "
                  "the rendered text differs. That is formatting, not "
                  "arithmetic. See docs/adr/ADR-0005-determinism.md."
              )

          for message in failures:
              print(f"::error title=Determinism::{message}")
          if failures:
              sys.exit(1)

          print(
              f"All {len(traces)} platforms produced the same trace "
              f"fingerprint: {fingerprints.pop()}"
          )
          PY

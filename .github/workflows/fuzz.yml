# Rule 7: untrusted input is treated as hostile — every parser is fuzzed.
#
# This workflow used to fail on purpose. There were no fuzz targets, README
# listed rule 7 under "enforced, not aspirational", and skipping the job would
# have made that sentence false in the quietest possible way: an all-green
# checks list with the fuzzing gate silently absent from it. So it failed with
# a message naming what was missing, and said so in this comment.
#
# The targets exist now — fuzz/fuzz_targets/{lex,parse,check}_*.rs — and this workflow does
# real work. The guard below survives from that arrangement in a different
# role: it no longer reports an unwritten thing, it catches fuzz/ being deleted
# or emptied. Without it, removing every target turns this job green, because a
# loop over nothing succeeds. That failure mode is exactly the one the original
# comment was written about, so the guard stays.
#
# ---------------------------------------------------------------------------
# What the schedule does and does not guarantee
# ---------------------------------------------------------------------------
#
#   * `schedule` triggers only on the repository's DEFAULT branch. Editing this
#     file on a branch changes nothing until it is merged there.
#   * Scheduled runs are best-effort. GitHub drops them under load, and the
#     cron time is a request, not an appointment. The minute below is off the
#     hour deliberately: everything queued at :00 competes with everything else
#     on the platform that also asked for :00.
#   * On a public repository, scheduled workflows are disabled automatically
#     after 60 days without repository activity, and GitHub emails an owner
#     rather than announcing it here. If fuzzing appears to have stopped, check
#     that this workflow is still enabled before assuming it is passing.
#
# Still not a pull-request check. A fuzzing run is a search, and a search that
# happens to find something on one branch and not another would fail merges at
# random. Making the *build* of these targets a pull-request check is a
# reasonable thing to want and a separate decision from this file.
name: fuzz

on:
  schedule:
    # 03:27 UTC daily. Off the hour on purpose; see above.
    - cron: "27 3 * * *"
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Per target. A nightly job is a regression smoke test, not a fuzzing
  # campaign: a minute per target re-runs the whole corpus and explores a
  # little past it, which is what catches a crash reintroduced yesterday.
  # Genuine discovery needs hours and a corpus that outlives one run — see
  # fuzz/README.md for how to do that locally.
  FUZZ_SECONDS: "60"

jobs:
  fuzz:
    name: cargo-fuzz over every target
    # ubuntu-latest only, and not by preference. cargo-fuzz drives libFuzzer
    # through the sanitizer runtime, which rustc supports on Unix targets and
    # not on the MSVC ones; `cargo fuzz` refuses to run on Windows outright.
    # macOS would work, but adds a second platform's worth of runner time for
    # a job whose findings are about input handling, not about the OS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # This is the first step on purpose. When there is nothing to fuzz, the
      # job should say so in ten seconds rather than after installing a nightly
      # toolchain and building cargo-fuzz for a corpus that does not exist.
      - name: Require fuzz targets to exist
        run: |
          set -euo pipefail
          if [ ! -d fuzz ]; then
            echo "::error title=No fuzz targets::README rule 7 says every parser is fuzzed. The fuzz/ directory is gone, so nothing is fuzzed and this job cannot pass. It is a separate cargo workspace; restore it rather than adding targets elsewhere."
            exit 1
          fi
          # `set -euo pipefail` is on, so this counts without a pipeline that
          # could abort the script before the message below is printed. A guard
          # that exits silently is not a guard anybody can act on.
          targets=0
          if [ -d fuzz/fuzz_targets ]; then
            for target in fuzz/fuzz_targets/*.rs; do
              [ -e "$target" ] && targets=$((targets + 1))
            done
          fi
          if [ "$targets" -eq 0 ]; then
            echo "::error title=No fuzz targets::fuzz/ exists but contains no target in fuzz/fuzz_targets/*.rs, so the loop below would fuzz nothing and pass. See the comment block at the top of .github/workflows/fuzz.yml."
            exit 1
          fi
          echo "Found $targets fuzz target(s)."

      # libFuzzer needs -Z sanitizer, which is nightly-only. The pinned stable
      # toolchain in rust-toolchain.toml stays the toolchain for everything
      # else; nightly is installed alongside it and named explicitly at every
      # call site below, so nothing else in this repository can drift onto it.
      - name: Install the nightly toolchain
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          # Fuzzing artefacts are built by a different toolchain from every
          # other job, with different flags; sharing one cache key would mean
          # each job repeatedly evicting the other's work.
          key: fuzz-nightly
          workspaces: fuzz

      # The corpus is the accumulated memory of every run before this one, and
      # it is where nearly all of a fuzzer's value lives: a minute of fuzzing
      # from scratch rediscovers what yesterday already knew, a minute starting
      # from yesterday's corpus goes somewhere new. Losing it silently turns
      # this job into a permanent first run.
      #
      # Restore-only would be enough to be useful; the save on the way out is
      # what makes it compound. Cache entries are immutable once written, so the
      # key carries the run id and `restore-keys` picks the most recent previous
      # entry by prefix. The seed corpus committed under fuzz/seeds/ is copied
      # out first and the restore unpacks on top of it, so the seeds are present
      # whether or not a cache entry exists.
      - name: Restore and persist the corpus
        uses: actions/cache@v6
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      # fuzz/corpus/ is not committed — libFuzzer grows it by thousands of
      # machine-named files per session. fuzz/seeds/ is: a small, hand-written
      # corpus whose file names say what each case is for. Copy the seeds in
      # before every run, so a cold cache still starts from something better
      # than an empty directory.
      - name: Seed the corpus
        run: |
          set -euo pipefail
          for dir in fuzz/seeds/*/; do
            target=$(basename "$dir")
            mkdir -p "fuzz/corpus/$target"
            cp -n "$dir"* "fuzz/corpus/$target/" 2>/dev/null || true
          done
          echo "Seeded $(find fuzz/corpus -type f | wc -l) corpus entries."

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # Built as its own step so that a compile error is reported as a compile
      # error, rather than as the first target in the loop below failing for
      # reasons the log makes look like a crash.
      - name: Build every fuzz target
        working-directory: fuzz
        run: cargo +nightly fuzz build

      - name: Run every fuzz target
        working-directory: fuzz
        run: |
          set -euo pipefail
          # `cargo fuzz run` exits non-zero when libFuzzer reports a crash, a
          # hang or an out-of-memory, and `set -e` turns that into a failed job.
          # Nothing here swallows a non-zero status, and nothing should: a
          # crash found and not reported is worse than not fuzzing at all.
          #
          #   -timeout=10       one input taking ten seconds is a hang; the
          #                     lexer is single-pass over bounded input and has
          #                     no business being anywhere near that.
          #   -rss_limit_mb=2048 rule 7 says a decoder must not allocate without
          #                     bound. This is the assertion for that half of
          #                     the rule — an input that inflates to 2 GB fails
          #                     the run instead of taking the runner down.
          for target in $(cargo +nightly fuzz list); do
            echo "::group::fuzzing $target"
            cargo +nightly fuzz run "$target" -- \
              -max_total_time="$FUZZ_SECONDS" \
              -timeout=10 \
              -rss_limit_mb=2048
            echo "::endgroup::"
          done

      # Uploaded only on failure: a crashing input is the entire output of a
      # failed fuzzing run, and losing it means the failure cannot be
      # reproduced. fuzz/README.md describes what to do with this artefact.
      # On a passing run there is nothing here worth keeping — the corpus is
      # already carried forward by the cache step above.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-artifacts
          path: |
            fuzz/artifacts/
            fuzz/corpus/
          if-no-files-found: ignore
          retention-days: 30

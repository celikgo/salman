# Rule 4: every URL in every doc resolves.
#
# "Every doc" is taken to include the Rust doc comments, because that is where
# most of salman's real references live — the algorithm papers, the PRNG
# reference implementations, the standards pages. A citation that 404s is
# indistinguishable from a citation that was never checked, and this project
# leans on its citations.
name: docs-links

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-links-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  links:
    name: every URL in Markdown and in Rust doc comments resolves
    # ubuntu-latest only, and not by preference: lychee-action's action.yml
    # hardcodes a `*-unknown-linux-gnu` release tarball, so the action cannot
    # run on the macOS or Windows runners at all. A URL resolves or does not
    # resolve independently of the machine asking, so one platform is also the
    # right amount.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        env:
          # Without a token, lychee's requests to github.com are unauthenticated
          # and get rate-limited into 429s, which look exactly like dead links.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # `fail: true` is stated rather than left to the default, because the
          # entire point of this job is that a dead link stops the build. A
          # future default change must not quietly turn this into a report.
          fail: true
          args: >-
            --no-progress
            --verbose
            --max-retries 3
            --retry-wait-time 5
            --timeout 30
            --max-concurrency 16
            --accept 200,206,301,302,308
            --exclude '^https?://[^/]*\.invalid(/|$)'
            --exclude '^https?://www\.plcopen\.org/xml/tc6_'
            --exclude '^https?://(www\.)?contributor-covenant\.org(/|$)'
            './**/*.md'
            './**/*.rs'

# ---------------------------------------------------------------------------
# Concurrency, and why it is not the default
# ---------------------------------------------------------------------------
#
# `--max-concurrency 16`
#
# lychee defaults to 128. This repository has 82 distinct URLs across 31 hosts,
# so at the default every one of them leaves at once, from a GitHub-hosted
# runner whose IP is shared with every other Actions job in the world. What a
# rate-limited host sees is a burst from an address it already distrusts, and
# what this job then sees is `Connection reset by peer` — a TCP reset, not a
# status code, so `--accept` cannot help and `--max-retries` only repeats the
# burst.
#
# That is not hypothetical: it is what turned this job red on PR #5, on a link
# that was live the whole time and passed on the next run with no change to the
# tree. Sixteen is slow enough not to look like an attack and fast enough that
# the job still finishes in seconds.
#
# ---------------------------------------------------------------------------
# The exclusions, and why
# ---------------------------------------------------------------------------
#
# `--exclude '^https?://[^/]*\.invalid(/|$)'`
#
# `.invalid` is one of the four TLDs RFC 2606 reserves precisely so that it can
# never be delegated and can never resolve. salman uses it as the placeholder
# in the citation-provenance tests (`crates/salman-core/src/clause.rs`), where
# the point is to have a URL-shaped string that is obviously not a real source.
# Asking a resolver about it would be asking a question whose answer is fixed
# by the RFC.
#
# The pattern is anchored and matches only the reserved TLD, so it cannot
# silently swallow a real host.
#
# `--exclude '^https?://www\.plcopen\.org/xml/tc6_'`
#
# These are XML **namespace names**, not links. A namespace name is an
# identifier that happens to be spelled as a URI; nothing in the XML namespaces
# specification requires it to dereference to anything, and plenty of widely
# used ones do not. `http://www.plcopen.org/xml/tc6_0200` returns 404 and is
# still the correct, byte-exact identifier for PLCopen XML v2.0 — changing it to
# something that resolves would mean salman no longer reads those documents.
#
# The pattern is deliberately narrow: the `tc6_` prefix, on that host, under
# `/xml/`. A dead link to PLCopen's actual documentation still fails this job,
# which is the point.
#
# `--exclude '^https?://(www\.)?contributor-covenant\.org(/|$)'`
#
# This one is a different kind, and saying so matters more than the exclusion.
#
# The two above are URLs that are **not meant to resolve**: `.invalid` cannot by
# RFC, and an XML namespace name is an identifier that merely looks like a URL.
# Excluding them costs nothing, because there was never anything to check.
#
# contributor-covenant.org is meant to resolve, and does. CODE_OF_CONDUCT.md
# links it four times — the homepage, the v2.1 text, the FAQ and the
# translations — as the standard Contributor Covenant attribution. The reason it
# is here is not that the link is dead but that the host intermittently refuses
# GitHub's shared runner IPs, and it refused three retries in a row on PR #5
# while answering this repository's author immediately.
#
# The cost is stated rather than hidden: **if contributor-covenant.org ever dies,
# this repository will not find out from CI.** That is a real loss. It is
# accepted because the alternative — a required gate that goes red for reasons
# outside the repository, on a schedule nobody controls — is how a gate becomes
# something people re-run without reading, and a gate nobody reads is worse than
# one honest gap.
#
# The `--max-concurrency` change above is the fix for the cause. This exclusion
# is the fix for the one host known to have tripped it. If neither is needed in
# six months, delete this and find out.
#
# Nothing else is excluded: if a link in this repository is unreachable, this
# job is meant to say so.
#
# `--accept 200,206,301,302,308` is a status allowlist, not an exclusion. It is
# here because several standards bodies answer a HEAD with a redirect chain,
# and a 301 to a page that exists is a link that resolves.

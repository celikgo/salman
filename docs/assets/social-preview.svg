<text x="454.02" y="186" fill="#ff7b72" class="m" xml:space="preserve">:= </text>
<text x="477.47999999999996" y="186" fill="#e6edf3" class="m" xml:space="preserve">Latch.Q1</text>
<text x="540.04" y="186" fill="#e6edf3" class="m" xml:space="preserve">, </text>
<text x="555.68" y="186" fill="#e6edf3" class="m" xml:space="preserve">PT </text>
<text x="579.14" y="186" fill="#ff7b72" class="m" xml:space="preserve">:= </text>

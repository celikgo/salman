<text x="64" y="112" fill="#e6edf3" font-size="56" font-weight="700" letter-spacing="-1.5">salman</text>
<text x="64" y="150" fill="#7d8590" font-size="16.5">IEC 61131-3, git-native</text>
<text x="64" y="206" fill="#e6edf3" font-size="14.5" opacity="0.93">A one-millisecond timing</text>
<text x="64" y="230" fill="#e6edf3" font-size="14.5" opacity="0.93">assertion, in a text file</text>
<text x="64" y="254" fill="#e6edf3" font-size="14.5" opacity="0.93">your reviewer can read,</text>
<text x="64" y="278" fill="#e6edf3" font-size="14.5" opacity="0.93">running headless in CI</text>
<text x="64" y="302" fill="#e6edf3" font-size="14.5" opacity="0.93">with no vendor licence.</text>
<line x1="64" y1="352" x2="228" y2="352" stroke="#484f58" stroke-width="1"/>
<text x="64" y="382" fill="#7d8590" font-size="13">The clock is virtual, so</text>
<text x="64" y="403" fill="#7d8590" font-size="13">thirty seconds of plant</text>
<text x="64" y="424" fill="#7d8590" font-size="13">time costs no wall time</text>
<text x="64" y="445" fill="#7d8590" font-size="13">and every run is identical.</text>
<text x="64" y="562" fill="#484f58" font-size="12.5">Rust · vendor-neutral · Apache-2.0</text>
<text x="1178" y="562" fill="#484f58" font-size="12.5" text-anchor="end">Not a safety tool. Never for designing or replacing a safety function.</text>
